{% extends "base.html" %}
{% load static %}

{% block title %}Sign In | CodeNest{% endblock %}

{% block content %}
<div class="auth-container">
    <a class="auth-brand" href="{% url 'index' %}" aria-label="CodeNest home">
        <img src="{% static 'images/codenest-logo.png' %}" alt="CodeNest" class="site-brand__logo">
    </a>
    <section class="auth-card">
        <h1>Sign in</h1>
        <p>Use your CodeNest account to ask questions and post answers.</p>

        <form method="post">
            {% csrf_token %}
            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Your username" value="{{ request.POST.username|default:'' }}" required>
            </div>
            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="app-btn app-btn--block">Sign in</button>
        </form>

        <p class="auth-card__footer">New to CodeNest? <a href="{% url 'register' %}">Create an account</a>.</p>
    </section>
</div>
{% endblock %}
